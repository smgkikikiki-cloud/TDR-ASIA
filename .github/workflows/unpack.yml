name: Unpack TDR ASIA source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          cat .payload/payload.part* | base64 -d > /tmp/tdr-asia.tgz
          tar -xzf /tmp/tdr-asia.tgz
          rm -rf .payload

      - name: Commit project source
        shell: bash
        run: |
          git config user.name "TDR ASIA bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap TDR ASIA newsroom" || exit 0
          git push
